<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Jaishi - Profile</title>
  <!-- Font Awesome CDN for Official Logos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Profile Header Box with GitHub Avatar -->
    <div class="profile-box">
      <div class="avatar-container">
        <img src="https://github.com/romanjaishi91-oss.png" alt="Roman Jaishi GitHub Profile Picture" class="profile-avatar">
      </div>
      <h1>Roman Jaishi</h1>
      <p>Personal Interests & Favorites</p>
    </div>

    <!-- Box 1: Gaming -->
    <div class="category-box gaming-box">
      <div class="box-header">
        <i class="fa-solid fa-gamepad"></i>
        <h2>Gaming</h2>
      </div>
      <div class="items-grid">
        <div class="item-card">
          <img class="icon-img" src="https://cdn.simpleicons.org/freefire/FF4500" alt="Free Fire Logo" />
          <span class="item-name">Free Fire</span>
        </div>
        <div class="item-card">
          <img class="icon-img" src="https://img.icons8.com/color/96/subway-surfers.png" alt="Subway Surfers Logo" />
          <span class="item-name">Subway Surfers</span>
        </div>
      </div>
    </div>

    <!-- Box 2: Sports -->
    <div class="category-box sports-box">
      <div class="box-header">
        <i class="fa-solid fa-trophy"></i>
        <h2>Sports</h2>
      </div>
      <div class="items-grid">
        <div class="item-card">
          <i class="fa-solid fa-baseball-bat-ball fa-icon cricket-icon"></i>
          <span class="item-name">Cricket</span>
        </div>
        <div class="item-card">
          <i class="fa-solid fa-football fa-icon football-icon"></i>
          <span class="item-name">Football</span>
        </div>
        <div class="item-card">
          <i class="fa-solid fa-basketball-ball fa-icon basketball-icon"></i>
          <span class="item-name">Basketball</span>
        </div>
      </div>
    </div>

    <!-- Box 3: Regular Apps & Profiles -->
    <div class="category-box apps-box">
      <div class="box-header">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <h2>Regular Apps & Links</h2>
      </div>
      <div class="items-grid">
        <a href="https://github.com/romanjaishi91-oss" target="_blank" class="item-card-link">
          <div class="item-card">
            <i class="fa-brands fa-github fa-icon github-logo"></i>
            <span class="item-name">GitHub</span>
          </div>
        </a>
        <div class="item-card">
          <i class="fa-brands fa-facebook fa-icon facebook-logo"></i>
          <span class="item-name">Facebook</span>
        </div>
        <div class="item-card">
          <i class="fa-brands fa-whatsapp fa-icon whatsapp-logo"></i>
          <span class="item-name">WhatsApp</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
